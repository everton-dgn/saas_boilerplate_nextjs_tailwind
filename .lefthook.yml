colors: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm commitlint --edit {1}

pre-commit:
  parallel: false

  jobs:
    - name: format
      glob: '*.{ts,tsx,js,json,css}'
      run: pnpm format && git add {staged_files}

    - name: lint
      glob: '*.{ts,tsx,js,json,css}'
      run: pnpm lint

    - name: typecheck
      glob: '*.{ts,tsx,json}'
      run: pnpm typecheck

    - name: secret-scan
      run: |
        if ! command -v kingfisher > /dev/null 2>&1; then
          echo "kingfisher não instalado; varredura de segredos ignorada."
          echo "Instale com: brew install kingfisher"
          exit 0
        fi
        pnpm scan:secrets --staged

pre-push:
  parallel: true

  jobs:
    - name: test
      glob: '*.{ts,tsx,json}'
      run: pnpm test

#    - name: packages-audit
#      run: pnpm audit
