name: Secret Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  scan:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      #  config_actions:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # add pnpm
      - name: Config pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      #  install_scanner:
      - name: Install pinned kingfisher
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/kingfisher.tar.gz \
            https://github.com/mongodb/kingfisher/releases/download/v1.110.0/kingfisher-linux-x64.tgz
          echo "f55296fe4c6090c27963b2f62f5938e90b187ab1357466c8661d3786f6be7f14  /tmp/kingfisher.tar.gz" | sha256sum --check
          tar -xzf /tmp/kingfisher.tar.gz -C /tmp kingfisher

      - name: Scan the working tree for secrets
        run: PATH="/tmp:${PATH}" pnpm scan:secrets
