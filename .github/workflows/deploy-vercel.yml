name: Production Deployment

env:
  VERCEL_ORG_ID: ${{ secrets.ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.PROJECT_ID }}
  LEFTHOOK: 0

on:
  push:
    branches:
      - main

jobs:
  Workflow:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      #  config_actions:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # add pnpm
      - name: Config pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      #  setup_node:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      #  install_dependencies:
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      #  typecheck:
      - name: Run Typescript Check
        run: pnpm typecheck

      #  lint:
      - name: Run Lint
        run: pnpm biome:ci

      #  test_ci:
      - name: Run Tests
        run: pnpm test:ci --reporter=verbose

      #  build_deploy:
      - name: Pull Vercel Environment Information
        run: pnpm dlx --allow-build=esbuild vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: pnpm dlx --allow-build=esbuild vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: pnpm dlx --allow-build=esbuild vercel deploy --prod --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
